<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .block1, .block2, .block3 {
            width: clamp(100px, 30vw, 200px);
            height: clamp(100px, 30vw, 200px);
        }
        
        .block1 {
            background-color: Blueviolet;
            position: relative;
            top: 20px;
            left: 20px;
            border: 4px blue solid;
            z-index: 6;
        }
        
        .block2 {
            background-color: aqua;
            position: relative;
            top: -50px;
            left: 60px;
            border: 4px violet solid;
            border-radius: 50%;
            z-index: 4;
        }
        
        .block3 {
            background-color: lightpink;
            position: relative;
            top: -120px;
            left: 100px;
            border: 4px darkred solid;
            border-radius: 50%;
            z-index: 8;
        }
    </style>
</head>

<body>
    <div class="block1"></div>
    <div class="block2"></div>
    <div class="block3"></div>
</body>

</html>
