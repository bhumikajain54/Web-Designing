<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration | Premium Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --radius: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: var(--text-main);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            max-width: 600px;
            width: 100%;
            padding: 50px;
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: fadeInUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }

        header { text-align: center; margin-bottom: 40px; }
        header h1 { font-size: 2.2rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        header p { color: #64748b; font-weight: 500; }

        .form-group { margin-bottom: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); font-size: 0.9rem; }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 14px 18px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .flex-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .radio-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 10px 0;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px var(--primary-glow);
            filter: brightness(1.1);
        }

        @media (max-width: 600px) {
            .form-card { padding: 30px 20px; }
            .flex-row { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <div class="form-card">
        <header>
            <h1>Join Our Community</h1>
            <p>Welcome, Bhumika! Please fill out the details below.</p>
        </header>

        <form method="post" action="p1.html">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="Fname" placeholder="Enter your name" required />
            </div>

            <div class="flex-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="name@example.com" />
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="+91 000 000 0000" />
                </div>
            </div>

            <div class="form-group">
                <label>Mailing Address</label>
                <textarea name="address" rows="3" placeholder="Street, City, State..."></textarea>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" />
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="radio-checkbox-group">
                    <label class="option-item"><input type="radio" name="gender" value="male" /> Male</label>
                    <label class="option-item"><input type="radio" name="gender" value="female" /> Female</label>
                </div>
            </div>

            <div class="form-group">
                <label>Areas of Interest</label>
                <div class="radio-checkbox-group">
                    <label class="option-item"><input type="checkbox" name="hobbies" value="cricket" /> Cricket</label>
                    <label class="option-item"><input type="checkbox" name="hobbies" value="cooking" /> Cooking</label>
                    <label class="option-item"><input type="checkbox" name="hobbies" value="singing" /> Singing</label>
                    <label class="option-item"><input type="checkbox" name="hobbies" value="badminton" /> Badminton</label>
                </div>
            </div>

            <div class="form-group">
                <label>Preferred City</label>
                <select name="city">
                    <option value="mumbai">Mumbai</option>
                    <option value="delhi">Delhi</option>
                    <option value="chennai">Chennai</option>
                    <option value="kolkata">Kolkata</option>
                    <option value="bangalore">Bangalore</option>
                    <option value="hyderabad">Hyderabad</option>
                </select>
            </div>

            <button type="submit">Create Account</button>
        </form>
    </div>
</body>

</html>
