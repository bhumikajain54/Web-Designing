<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        h1 {
            text-align: center;
            color: #333;
        }
    </style>

</head>

<body>
    <h1>My name is Bhumika</h1>
    <form method="post" action="p1.html">
        Name: <input type="text" name="Fname" required="required" /><br /><br /> Email: <input type="email" name="email" /><br /><br /> Phone: <input type="tel" name="phone" /><br /><br /> Address : <textarea name="address" rows="5" ,cols="50"></textarea><br
        /><br /> Password: <input type="password" name="password" /><br /><br /> Gender: <input type="radio" name="gender" value="male" />Male
        <input type="radio" name="gender" value="female" />Female<br /><br /> Hobbies: <input type="checkbox" name="hobbies" value="cricket" />Cricket
        <input type="checkbox" name="hobbies" value="cooking" />Cooking
        <input type="checkbox" name="hobbies" value="singing" />Singing
        <input type="checkbox" name="hobbies" value="Badminton" />Badminton <br><br> City: <select name="city">
          <option value="mumbai">Mumbai</option>
          <option value="delhi">Delhi</option>
          <option value="chennai">Chennai</option>
          <option value="kolkata">Kolkata</option>
          <option value="bangalore">Bangalore</option>
          <option value="hyderabad">Hyderabad</option>
          <option value="pune">Pune</option>
          <option value="ahmedabad">Ahmedabad</option>
          <option value="jaipur">Jaipur</option>
          <option value="chandigarh">Chandigarh</option>
          <option value="cochin">Cochin</option>
          <option value="kochi">Kochi</option>
          <option value="thiruvananthapuram">Thiruvananth</option></select><br /><br /> Submit: <input type="submit" value="Submit" />
    </form>
</body>

</html>
